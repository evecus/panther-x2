name: RootFS NixOS ARM64

on:
  workflow_dispatch:
    inputs:
      nixos_channel:
        description: "NixOS channel"
        required: true
        default: "nixos-25.11"
        type: choice
        options:
          - nixos-25.11
          - nixos-unstable
      armbian_fstype:
        description: "RootFS filesystem"
        required: true
        default: "ext4"
        type: choice
        options:
          - ext4
          - btrfs
      root_password:
        description: "Root password"
        required: true
        default: "root"
        type: string
      hostname:
        description: "Hostname"
        required: true
        default: "nixos"
        type: string
      timezone:
        description: "Timezone"
        required: true
        default: "Asia/Shanghai"
        type: string

env:
  TZ: UTC
  ROOTFS_DIR: /builder/nixos-rootfs

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            btrfs-progs \
            e2fsprogs \
            xz-utils \
            openssl \
            rsync \
            curl \
            git \
            xz-utils

      - name: Install Nix
        run: |
          set -euxo pipefail
          if ! command -v nix >/dev/null 2>&1; then
            curl -L https://nixos.org/nix/install | sh -s -- --daemon
          fi

          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version

      - name: Build NixOS ARM64 rootfs
        env:
          NIXOS_CHANNEL: ${{ inputs.nixos_channel }}
          HOSTNAME_VAL: ${{ inputs.hostname }}
          TZ_VAL: ${{ inputs.timezone }}
          ROOT_PASSWORD: ${{ inputs.root_password }}
          FSTYPE: ${{ inputs.armbian_fstype }}
        run: |
          set -euxo pipefail

          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

          mkdir -p /builder "${ROOTFS_DIR}"

          echo "NixOS channel : ${NIXOS_CHANNEL}"
          echo "Architecture  : aarch64-linux"
          echo "Hostname      : ${HOSTNAME_VAL}"
          echo "Timezone      : ${TZ_VAL}"
          echo "Filesystem    : ${FSTYPE}"

          # Generate the password hash in Bash first. The Nix file below is quoted,
          # so Bash will not try to expand Nix expressions such as ${config...}.
          HASHED_PASSWORD="$(openssl passwd -6 "${ROOT_PASSWORD}")"

          export NIXOS_HOSTNAME="${HOSTNAME_VAL}"
          export NIXOS_TIMEZONE="${TZ_VAL}"
          export NIXOS_ROOT_PASSWORD="${HASHED_PASSWORD}"

          cat > /builder/configuration.nix <<'EOF'
          { config, pkgs, lib, ... }:

          {
            system.stateVersion = "25.11";

            nixpkgs.hostPlatform = "aarch64-linux";

            boot.loader.grub.enable = false;

            networking.hostName = builtins.getEnv "NIXOS_HOSTNAME";
            networking.networkmanager.enable = true;
            networking.useDHCP = lib.mkDefault true;

            time.timeZone = builtins.getEnv "NIXOS_TIMEZONE";

            services.openssh = {
              enable = true;
              settings = {
                PermitRootLogin = "yes";
                PasswordAuthentication = true;
              };
            };

            users.users.root = {
              hashedPassword = builtins.getEnv "NIXOS_ROOT_PASSWORD";
            };

            environment.systemPackages = with pkgs; [
              bash
              coreutils
              curl
              wget
              git
              vim
              nano
              htop
              procps
              iproute2
              iputils
              ethtool
              pciutils
              usbutils
              rsync
              openssl
              file
              util-linux
              e2fsprogs
              btrfs-progs
            ];

            services.chrony.enable = true;
            services.timesyncd.enable = false;

            networking.firewall = {
              enable = true;
              allowedTCPPorts = [ 22 ];
            };

            i18n.defaultLocale = "en_US.UTF-8";

            nix.settings = {
              experimental-features = [ "nix-command" "flakes" ];
              auto-optimise-store = true;
              trusted-users = [ "root" ];
            };

            nix.gc = {
              automatic = true;
              dates = "weekly";
              options = "--delete-older-than 7d";
            };

            documentation = {
              enable = false;
              nixos.enable = false;
              man.enable = false;
            };

            services.xserver.enable = false;

            systemd.tmpfiles.rules = [
              "d /tmp 1777 root root -"
            ];

            # A plain rootfs tree. This is suitable as a filesystem rootfs archive;
            # it is not a board-specific bootable SD/eMMC image.
            system.build.rootfs = pkgs.runCommand "nixos-rootfs" {
              nativeBuildInputs = [ pkgs.rsync ];
            } ''
              mkdir -p "$out"

              # Copy the complete NixOS system closure into the rootfs.
              mkdir -p "$out/run/current-system"
              cp -a ${config.system.build.toplevel}/. "$out/run/current-system/"

              mkdir -p "$out/etc" "$out/var" "$out/home" "$out/root"
              mkdir -p "$out/bin" "$out/sbin"

              ln -sfn /run/current-system/sw/bin "$out/bin/sw"
              ln -sfn /run/current-system/sw/bin/bash "$out/bin/bash"

              cat > "$out/etc/NIXOS_ROOTFS" <<'ROOTFS_EOF'
              This is a NixOS ARM64 root filesystem.
              Architecture: aarch64-linux
              ROOTFS_EOF
            '';
          }
          EOF

          echo "Validating NixOS configuration..."

          nix-instantiate \
            --eval \
            --strict \
            '<nixpkgs/nixos>' \
            -A config.system.build.toplevel \
            --argstr system aarch64-linux \
            -I nixpkgs="https://github.com/NixOS/nixpkgs/archive/${NIXOS_CHANNEL}.tar.gz" \
            -I nixos-config=/builder/configuration.nix

          echo "Building NixOS rootfs..."

          nix-build \
            '<nixpkgs/nixos>' \
            -A config.system.build.rootfs \
            --argstr system aarch64-linux \
            -I nixpkgs="https://github.com/NixOS/nixpkgs/archive/${NIXOS_CHANNEL}.tar.gz" \
            -I nixos-config=/builder/configuration.nix \
            --no-out-link

          # Re-run with an explicit result symlink so the path is easy to consume.
          nix-build \
            '<nixpkgs/nixos>' \
            -A config.system.build.rootfs \
            --argstr system aarch64-linux \
            -I nixpkgs="https://github.com/NixOS/nixpkgs/archive/${NIXOS_CHANNEL}.tar.gz" \
            -I nixos-config=/builder/configuration.nix \
            -o /builder/result

          rm -rf "${ROOTFS_DIR}"
          mkdir -p "${ROOTFS_DIR}"
          cp -a /builder/result/. "${ROOTFS_DIR}/"

          echo "Rootfs contents:"
          du -sh "${ROOTFS_DIR}"
          ls -la "${ROOTFS_DIR}"

      - name: Pack rootfs
        env:
          FSTYPE: ${{ inputs.armbian_fstype }}
        run: |
          set -euxo pipefail

          mkdir -p /builder/output

          tar -C "${ROOTFS_DIR}" \
            --numeric-owner \
            -czf /builder/output/nixos-aarch64-rootfs.tar.gz .

          if [ "${FSTYPE}" = "ext4" ]; then
            SIZE_MB="$(du -sm "${ROOTFS_DIR}" | awk '{print $1 + 256}')"
            truncate -s "${SIZE_MB}M" /builder/output/nixos-aarch64-rootfs.ext4.img
            mkfs.ext4 -F /builder/output/nixos-aarch64-rootfs.ext4.img

            MNT="$(mktemp -d)"
            sudo mount -o loop /builder/output/nixos-aarch64-rootfs.ext4.img "${MNT}"
            sudo cp -a "${ROOTFS_DIR}/." "${MNT}/"
            sync
            sudo umount "${MNT}"
            rmdir "${MNT}"

            xz -T0 -f /builder/output/nixos-aarch64-rootfs.ext4.img
          else
            SIZE_MB="$(du -sm "${ROOTFS_DIR}" | awk '{print $1 + 256}')"
            truncate -s "${SIZE_MB}M" /builder/output/nixos-aarch64-rootfs.btrfs.img
            mkfs.btrfs -f /builder/output/nixos-aarch64-rootfs.btrfs.img

            MNT="$(mktemp -d)"
            sudo mount -o loop /builder/output/nixos-aarch64-rootfs.btrfs.img "${MNT}"
            sudo cp -a "${ROOTFS_DIR}/." "${MNT}/"
            sync
            sudo umount "${MNT}"
            rmdir "${MNT}"

            xz -T0 -f /builder/output/nixos-aarch64-rootfs.btrfs.img
          fi

          sha256sum /builder/output/* > /builder/output/SHA256SUMS
          ls -lh /builder/output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nixos-aarch64-rootfs
          path: /builder/output/*

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nixos-${{ github.run_number }}
          name: NixOS ARM64 RootFS ${{ github.run_number }}
          generate_release_notes: true
          files: |
            /builder/output/nixos-aarch64-rootfs.tar.gz
            /builder/output/nixos-aarch64-rootfs.*.img.xz
            /builder/output/SHA256SUMS
