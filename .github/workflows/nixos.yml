name: RootFS NixOS ARM64

on:
  workflow_dispatch:
    inputs:
      nixos_channel:
        description: "NixOS channel"
        required: true
        default: "nixos-25.11"
        type: choice
        options:
          - nixos-25.11
          - nixos-unstable
      armbian_fstype:
        description: "RootFS filesystem"
        required: true
        default: "ext4"
        type: choice
        options:
          - ext4
          - btrfs
      root_password:
        description: "Root password"
        required: true
        default: "root"
        type: string
      hostname:
        description: "Hostname"
        required: true
        default: "nixos"
        type: string
      timezone:
        description: "Timezone"
        required: true
        default: "Asia/Shanghai"
        type: string

env:
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            btrfs-progs \
            e2fsprogs \
            xz-utils \
            openssl \
            rsync \
            curl \
            git

      - name: Install Nix
        run: |
          set -euxo pipefail
          if ! command -v nix >/dev/null 2>&1; then
            curl -L https://nixos.org/nix/install | sh -s -- --daemon
          fi

          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version

      - name: Build NixOS ARM64 rootfs
        env:
          NIXOS_CHANNEL: ${{ inputs.nixos_channel }}
          HOSTNAME_VAL: ${{ inputs.hostname }}
          TZ_VAL: ${{ inputs.timezone }}
          ROOT_PASSWORD: ${{ inputs.root_password }}
          FSTYPE: ${{ inputs.armbian_fstype }}
        run: |
          set -euxo pipefail

          ROOTFS_DIR="${RUNNER_TEMP}/nixos-rootfs"
          OUTPUT_DIR="${RUNNER_TEMP}/nixos-output"
          export ROOTFS_DIR OUTPUT_DIR

          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

          BUILD_DIR="${RUNNER_TEMP}/nixos-builder"
          export BUILD_DIR

          rm -rf "${BUILD_DIR}" "${ROOTFS_DIR}" "${OUTPUT_DIR}"
          mkdir -p "${BUILD_DIR}" "${ROOTFS_DIR}" "${OUTPUT_DIR}"

          echo "NixOS channel : ${NIXOS_CHANNEL}"
          echo "Architecture  : aarch64-linux"
          echo "Hostname      : ${HOSTNAME_VAL}"
          echo "Timezone      : ${TZ_VAL}"
          echo "Filesystem    : ${FSTYPE}"

          HASHED_PASSWORD="$(openssl passwd -6 "${ROOT_PASSWORD}")"

          export NIXOS_HOSTNAME="${HOSTNAME_VAL}"
          export NIXOS_TIMEZONE="${TZ_VAL}"
          export NIXOS_ROOT_PASSWORD="${HASHED_PASSWORD}"
          export NIXOS_FSTYPE="${FSTYPE}"

          cat > "${BUILD_DIR}/configuration.nix" <<'EOF'
          { config, pkgs, lib, ... }:

          {
            system.stateVersion = "25.11";

            nixpkgs.hostPlatform = "aarch64-linux";

            boot.loader.grub.enable = false;
            boot.loader.systemd-boot.enable = false;

            # NixOS 要求必须声明根文件系统；这是纯 rootfs，
            # device 仅作占位，不参与真实挂载。
            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos-root";
              fsType = builtins.getEnv "NIXOS_FSTYPE";
            };

            networking.hostName = builtins.getEnv "NIXOS_HOSTNAME";
            networking.networkmanager.enable = true;
            networking.useDHCP = lib.mkDefault true;

            time.timeZone = builtins.getEnv "NIXOS_TIMEZONE";

            services.openssh = {
              enable = true;
              settings = {
                PermitRootLogin = "yes";
                PasswordAuthentication = true;
              };
            };

            users.users.root = {
              hashedPassword = builtins.getEnv "NIXOS_ROOT_PASSWORD";
            };

            environment.systemPackages = with pkgs; [
              bash
              coreutils
              curl
              wget
              nano
              htop
              procps
              iproute2
              iputils
              ethtool
              pciutils
              usbutils
              rsync
              openssl
              file
              util-linux
              e2fsprogs
              btrfs-progs
            ];

            services.chrony.enable = true;
            services.timesyncd.enable = false;

            networking.firewall = {
              enable = true;
              allowedTCPPorts = [ 22 ];
            };

            i18n.defaultLocale = "en_US.UTF-8";

            nix.settings = {
              experimental-features = [ "nix-command" "flakes" ];
              auto-optimise-store = true;
              trusted-users = [ "root" ];
            };

            nix.gc = {
              automatic = true;
              dates = "weekly";
              options = "--delete-older-than 7d";
            };

            documentation = {
              enable = false;
              nixos.enable = false;
              man.enable = false;
            };

            services.xserver.enable = false;

            systemd.tmpfiles.rules = [
              "d /tmp 1777 root root -"
            ];

            # ---- 精简：只保留 systemPackages 里明确声明的包 + 基础服务依赖 ----
            # 纯 rootfs，由设备自带内核启动：不要内核 / modules / initrd
            boot.kernel.enable = false;
            boot.initrd.enable = false;
            boot.bootspec.enable = false;
            boot.enableContainers = false;

            # 去掉默认附带的 perl / rsync / strace 等
            environment.defaultPackages = lib.mkForce [ ];
            # 去掉 nixos-rebuild(python) / nixos-generate-config / nixos-option 等
            system.disableInstallerTools = true;

            networking.modemmanager.enable = false;
            programs.command-not-found.enable = false;
            programs.bash.completion.enable = false;
            environment.stub-ld.enable = false;
            fonts.fontconfig.enable = false;
            i18n.supportedLocales = [ "en_US.UTF-8/UTF-8" ];

            system.build.rootfs =
              let
                closure = pkgs.closureInfo { rootPaths = [ config.system.build.toplevel ]; };
              in
              pkgs.runCommand "nixos-rootfs" { } ''
                mkdir -p "$out/nix/store"
                xargs -a ${closure}/store-paths cp -a -t "$out/nix/store/"
                cp ${closure}/registration "$out/nix-path-registration"

                mkdir -p "$out"/{etc,var,home,root,tmp,proc,sys,dev,run,sbin,bin,usr}
                chmod 1777 "$out/tmp"
                ln -s ${config.system.build.toplevel} "$out/nix-system"
                ln -s ${config.system.build.toplevel}/init "$out/sbin/init"
                ln -s ${config.system.build.toplevel}/init "$out/init"
                touch "$out/etc/NIXOS"
              '';
          }
          EOF

          echo "Building NixOS rootfs..."

          nix-build \
            '<nixpkgs/nixos>' \
            -A config.system.build.rootfs \
            --argstr system aarch64-linux \
            -I nixpkgs="https://github.com/NixOS/nixpkgs/archive/${NIXOS_CHANNEL}.tar.gz" \
            -I nixos-config="${BUILD_DIR}/configuration.nix" \
            -o "${BUILD_DIR}/result"

          sudo cp -a "${BUILD_DIR}/result/." "${ROOTFS_DIR}/"

          echo "Rootfs contents:"
          sudo du -sh "${ROOTFS_DIR}"
          sudo ls -la "${ROOTFS_DIR}"

      - name: Pack rootfs
        env:
          FSTYPE: ${{ inputs.armbian_fstype }}
        run: |
          set -euxo pipefail

          ROOTFS_DIR="${RUNNER_TEMP}/nixos-rootfs"
          OUTPUT_DIR="${RUNNER_TEMP}/nixos-output"
          export ROOTFS_DIR OUTPUT_DIR

          mkdir -p "${OUTPUT_DIR}"

          sudo tar -C "${ROOTFS_DIR}" \
            --numeric-owner \
            -czf "${OUTPUT_DIR}/nixos-aarch64-rootfs.tar.gz" .
          sudo chown "$(id -u):$(id -g)" "${OUTPUT_DIR}/nixos-aarch64-rootfs.tar.gz"

          SIZE_MB="$(sudo du -sm "${ROOTFS_DIR}" | awk '{print $1 + 256}')"

          if [ "${FSTYPE}" = "ext4" ]; then
            IMG="${OUTPUT_DIR}/nixos-aarch64-rootfs.ext4.img"
            truncate -s "${SIZE_MB}M" "${IMG}"
            mkfs.ext4 -F -L nixos-root "${IMG}"

            MNT="$(mktemp -d)"
            sudo mount -o loop "${IMG}" "${MNT}"
            sudo cp -a "${ROOTFS_DIR}/." "${MNT}/"
            sync
            sudo umount "${MNT}"
            rmdir "${MNT}"

            sudo chown "$(id -u):$(id -g)" "${IMG}"
            xz -T0 -f "${IMG}"
          else
            IMG="${OUTPUT_DIR}/nixos-aarch64-rootfs.btrfs.img"
            truncate -s "${SIZE_MB}M" "${IMG}"
            mkfs.btrfs -f -L nixos-root "${IMG}"

            MNT="$(mktemp -d)"
            sudo mount -o loop "${IMG}" "${MNT}"
            sudo cp -a "${ROOTFS_DIR}/." "${MNT}/"
            sync
            sudo umount "${MNT}"
            rmdir "${MNT}"

            sudo chown "$(id -u):$(id -g)" "${IMG}"
            xz -T0 -f "${IMG}"
          fi

          sha256sum "${OUTPUT_DIR}"/* > "${OUTPUT_DIR}/SHA256SUMS"
          ls -lh "${OUTPUT_DIR}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nixos-aarch64-rootfs
          path: ${{ runner.temp }}/nixos-output/*

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nixos-${{ github.run_number }}
          name: NixOS ARM64 RootFS ${{ github.run_number }}
          files: |
            ${{ runner.temp }}/nixos-output/nixos-aarch64-rootfs.*.img.xz
