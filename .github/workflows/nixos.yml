name: RootFS NixOS

on:
  workflow_dispatch:
    inputs:
      nixos_channel:
        description: "NixOS channel"
        required: true
        default: "nixos-25.11"
        type: choice
        options:
          - nixos-25.11
          - nixos-unstable
      armbian_fstype:
        description: "RootFS filesystem"
        required: true
        default: "ext4"
        type: choice
        options:
          - ext4
          - btrfs
      root_password:
        description: "Root password"
        required: true
        default: "root"
        type: string
      hostname:
        description: "Hostname"
        required: true
        default: "nixos"
        type: string
      timezone:
        description: "Timezone"
        required: true
        default: "Asia/Shanghai"
        type: string

env:
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            btrfs-progs \
            e2fsprogs \
            xz-utils \
            openssl \
            rsync \
            curl \
            git

      - name: Install Nix
        run: |
          set -euxo pipefail
          if ! command -v nix >/dev/null 2>&1; then
            curl -L https://nixos.org/nix/install | sh -s -- --daemon
          fi

          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version

      - name: Build NixOS ARM64 rootfs
        env:
          NIXOS_CHANNEL: ${{ inputs.nixos_channel }}
          HOSTNAME_VAL: ${{ inputs.hostname }}
          TZ_VAL: ${{ inputs.timezone }}
          ROOT_PASSWORD: ${{ inputs.root_password }}
          FSTYPE: ${{ inputs.armbian_fstype }}
        run: |
          set -euxo pipefail

          ROOTFS_DIR="${RUNNER_TEMP}/nixos-rootfs"
          OUTPUT_DIR="${RUNNER_TEMP}/nixos-output"
          export ROOTFS_DIR OUTPUT_DIR

          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

          BUILD_DIR="${RUNNER_TEMP}/nixos-builder"
          export BUILD_DIR

          rm -rf "${BUILD_DIR}" "${ROOTFS_DIR}" "${OUTPUT_DIR}"
          mkdir -p "${BUILD_DIR}" "${ROOTFS_DIR}" "${OUTPUT_DIR}"

          echo "NixOS channel : ${NIXOS_CHANNEL}"
          echo "Architecture  : aarch64-linux"
          echo "Hostname      : ${HOSTNAME_VAL}"
          echo "Timezone      : ${TZ_VAL}"
          echo "Filesystem    : ${FSTYPE}"

          HASHED_PASSWORD="$(openssl passwd -6 "${ROOT_PASSWORD}")"

          export NIXOS_HOSTNAME="${HOSTNAME_VAL}"
          export NIXOS_TIMEZONE="${TZ_VAL}"
          export NIXOS_ROOT_PASSWORD="${HASHED_PASSWORD}"
          export NIXOS_FSTYPE="${FSTYPE}"

          cat > "${BUILD_DIR}/configuration.nix" <<'EOF'
          { config, pkgs, lib, ... }:

          {
            system.stateVersion = "25.11";

            nixpkgs.hostPlatform = "aarch64-linux";

            boot.loader.grub.enable = false;
            boot.loader.systemd-boot.enable = false;

            # 标签与 rebuild 创建的分区一致(ROOTFS / BOOT)，install-to-emmc 克隆后标签不变，
            # 因此不需要再改 fstab。
            fileSystems."/" = {
              device = "/dev/disk/by-label/ROOTFS";
              fsType = builtins.getEnv "NIXOS_FSTYPE";
              options = [ "noatime" ];
            };
            fileSystems."/boot" = {
              device = "/dev/disk/by-label/BOOT";
              fsType = "ext4";
              options = [ "noatime" "nofail" ];
            };

            # 首次启动导入 Nix 数据库。不导入的话 store 路径未注册，
            # nix.gc 会把整个系统当垃圾删掉。
            boot.postBootCommands = ''
              if [ -f /nix-path-registration ]; then
                ${config.nix.package.out}/bin/nix-store --load-db < /nix-path-registration \
                  && rm -f /nix-path-registration
              fi
              ${config.nix.package.out}/bin/nix-env -p /nix/var/nix/profiles/system --set /run/current-system
            '';

            networking.hostName = builtins.getEnv "NIXOS_HOSTNAME";
            # 使用 systemd-networkd(去掉 NetworkManager / ModemManager / ppp)
            networking.networkmanager.enable = false;
            networking.useNetworkd = true;
            networking.useDHCP = false;
            systemd.network.enable = true;
            systemd.network.networks."10-wired" = {
              matchConfig.Name = "en* eth*";
              networkConfig = {
                DHCP = "yes";
                IPv6AcceptRA = true;
              };
              linkConfig.RequiredForOnline = "no";
            };
            systemd.network.wait-online.enable = false;
            services.resolved.enable = true;

            time.timeZone = builtins.getEnv "NIXOS_TIMEZONE";

            services.openssh = {
              enable = true;
              settings = {
                PermitRootLogin = "yes";
                PasswordAuthentication = true;
              };
            };

            users.users.root = {
              hashedPassword = builtins.getEnv "NIXOS_ROOT_PASSWORD";
            };

            environment.systemPackages = with pkgs; [
              bash
              coreutils
              curl
              wget
              nano
              htop
              procps
              iproute2
              iputils
              ethtool
              pciutils
              usbutils
              rsync
              openssl
              file
              util-linux
              e2fsprogs
              btrfs-progs
              parted
            ];

            services.chrony.enable = true;
            services.timesyncd.enable = false;

            networking.firewall = {
              enable = true;
              allowedTCPPorts = [ 22 ];
            };

            i18n.defaultLocale = "en_US.UTF-8";

            nix.settings = {
              experimental-features = [ "nix-command" "flakes" ];
              auto-optimise-store = true;
              trusted-users = [ "root" ];
            };

            nix.gc = {
              automatic = true;
              dates = "weekly";
              options = "--delete-older-than 7d";
            };

            documentation = {
              enable = false;
              nixos.enable = false;
              man.enable = false;
            };

            services.xserver.enable = false;

            systemd.tmpfiles.rules = [
              "d /tmp 1777 root root -"
            ];

            # ---- 精简：只保留 systemPackages 里明确声明的包 + 基础服务依赖 ----
            # 纯 rootfs，由设备自带内核启动：不要内核 / modules / initrd
            boot.kernel.enable = false;
            boot.initrd.enable = false;
            boot.bootspec.enable = false;
            boot.enableContainers = false;

            # 去掉默认附带的 perl / rsync / strace 等
            environment.defaultPackages = lib.mkForce [ ];
            # 去掉 nixos-rebuild(python) / nixos-generate-config / nixos-option 等
            system.disableInstallerTools = true;

            programs.command-not-found.enable = false;
            programs.bash.completion.enable = false;
            environment.stub-ld.enable = false;
            fonts.fontconfig.enable = false;
            i18n.supportedLocales = [ "en_US.UTF-8/UTF-8" ];

            # ---- panther 运行时机制(原 rootfs-overlay 的 systemd 单元 / sysctl / modprobe) ----
            # 脚本本体由 rebuild 放进 /usr/sbin，/etc/default/panther-* 与 /etc/balance_irq 可就地编辑。
            boot.extraModprobeConfig = "options brcmfmac feature_disable=0x282000";

            boot.kernel.sysctl = lib.mapAttrs (_: v: lib.mkForce v) {
              "kernel.printk" = "7 4 1 7";
              "net.ipv4.tcp_syncookies" = 1;
              "net.ipv4.ip_forward" = 1;
              "net.ipv6.conf.all.forwarding" = 1;
              "net.ipv4.tcp_fin_timeout" = 30;
              "net.ipv4.tcp_keepalive_time" = 120;
              "net.ipv4.tcp_timestamps" = 1;
              "net.ipv4.tcp_sack" = 1;
              "net.ipv4.tcp_dsack" = 1;
              "net.core.rmem_max" = 4194304;
              "net.core.wmem_max" = 1048576;
              "net.netfilter.nf_conntrack_acct" = 1;
              "net.netfilter.nf_conntrack_checksum" = 0;
              "net.netfilter.nf_conntrack_max" = 65535;
              "net.netfilter.nf_conntrack_tcp_timeout_established" = 7440;
              "net.netfilter.nf_conntrack_udp_timeout" = 60;
              "net.netfilter.nf_conntrack_udp_timeout_stream" = 180;
              "net.ipv4.tcp_congestion_control" = "bbr";
              "net.core.default_qdisc" = "fq";
            };

            systemd.services.panther-resize = {
              description = "Panther root filesystem auto-resize (first boot)";
              wantedBy = [ "multi-user.target" ];
              after = [ "local-fs.target" ];
              before = [ "sshd.service" ];
              unitConfig.ConditionPathExists = "!/var/lib/panther/resize-done";
              path = with pkgs; [ util-linux e2fsprogs parted systemd coreutils ];
              serviceConfig = {
                Type = "oneshot";
                ExecStart = "/usr/sbin/panther-resize";
                TimeoutStartSec = "6min";
              };
            };

            systemd.services.panther-irq = {
              description = "Panther IRQ affinity & RPS balancing";
              wantedBy = [ "multi-user.target" ];
              after = [ "multi-user.target" ];
              path = with pkgs; [ coreutils gawk gnugrep ];
              serviceConfig = {
                Type = "oneshot";
                RemainAfterExit = true;
                ExecStart = "/usr/sbin/balethirq";
              };
            };

            systemd.services.panther-cpufreq = {
              description = "Panther CPU frequency policy";
              wantedBy = [ "multi-user.target" ];
              after = [ "multi-user.target" ];
              path = with pkgs; [ coreutils ];
              serviceConfig = {
                Type = "oneshot";
                RemainAfterExit = true;
                ExecStart = "/usr/sbin/panther-cpufreq";
              };
            };

            systemd.services.panther-swapfile = {
              description = "Panther swapfile";
              wantedBy = [ "multi-user.target" ];
              after = [ "local-fs.target" ];
              path = with pkgs; [ coreutils util-linux ];
              serviceConfig = {
                Type = "oneshot";
                RemainAfterExit = true;
                ExecStart = "/usr/sbin/panther-swapfile";
              };
            };

            system.build.rootfs =
              let
                closure = pkgs.closureInfo { rootPaths = [ config.system.build.toplevel ]; };
              in
              pkgs.runCommand "nixos-rootfs" { } ''
                mkdir -p "$out/nix/store"
                xargs -a ${closure}/store-paths cp -a -t "$out/nix/store/"
                cp ${closure}/registration "$out/nix-path-registration"

                mkdir -p "$out"/{etc,var,home,root,tmp,proc,sys,dev,run,sbin,bin,usr}
                chmod 1777 "$out/tmp"
                ln -s ${config.system.build.toplevel} "$out/nix-system"
                ln -s ${config.system.build.toplevel}/init "$out/sbin/init"
                ln -s ${config.system.build.toplevel}/init "$out/init"
                touch "$out/etc/NIXOS"
              '';
          }
          EOF

          echo "Building NixOS rootfs..."

          nix-build \
            '<nixpkgs/nixos>' \
            -A config.system.build.rootfs \
            --argstr system aarch64-linux \
            -I nixpkgs="https://github.com/NixOS/nixpkgs/archive/${NIXOS_CHANNEL}.tar.gz" \
            -I nixos-config="${BUILD_DIR}/configuration.nix" \
            -o "${BUILD_DIR}/result"

          sudo cp -a "${BUILD_DIR}/result/." "${ROOTFS_DIR}/"

          echo "Rootfs contents:"
          sudo du -sh "${ROOTFS_DIR}"
          sudo ls -la "${ROOTFS_DIR}"

      - name: Pack rootfs
        env:
          FSTYPE: ${{ inputs.armbian_fstype }}
        run: |
          set -euxo pipefail

          ROOTFS_DIR="${RUNNER_TEMP}/nixos-rootfs"
          OUTPUT_DIR="${RUNNER_TEMP}/nixos-output"
          export ROOTFS_DIR OUTPUT_DIR

          mkdir -p "${OUTPUT_DIR}"

          sudo tar -C "${ROOTFS_DIR}" \
            --numeric-owner \
            -czf "${OUTPUT_DIR}/nixos-aarch64-rootfs.tar.gz" .
          sudo chown "$(id -u):$(id -g)" "${OUTPUT_DIR}/nixos-aarch64-rootfs.tar.gz"

          SIZE_MB="$(sudo du -sm "${ROOTFS_DIR}" | awk '{print $1 + 256}')"

          if [ "${FSTYPE}" = "ext4" ]; then
            IMG="${OUTPUT_DIR}/nixos-aarch64-rootfs.ext4.img"
            truncate -s "${SIZE_MB}M" "${IMG}"
            mkfs.ext4 -F -L ROOTFS "${IMG}"

            MNT="$(mktemp -d)"
            sudo mount -o loop "${IMG}" "${MNT}"
            sudo cp -a "${ROOTFS_DIR}/." "${MNT}/"
            sync
            sudo umount "${MNT}"
            rmdir "${MNT}"

            sudo chown "$(id -u):$(id -g)" "${IMG}"
            xz -T0 -f "${IMG}"
          else
            IMG="${OUTPUT_DIR}/nixos-aarch64-rootfs.btrfs.img"
            truncate -s "${SIZE_MB}M" "${IMG}"
            mkfs.btrfs -f -L ROOTFS "${IMG}"

            MNT="$(mktemp -d)"
            sudo mount -o loop "${IMG}" "${MNT}"
            sudo cp -a "${ROOTFS_DIR}/." "${MNT}/"
            sync
            sudo umount "${MNT}"
            rmdir "${MNT}"

            sudo chown "$(id -u):$(id -g)" "${IMG}"
            xz -T0 -f "${IMG}"
          fi

          sha256sum "${OUTPUT_DIR}"/* > "${OUTPUT_DIR}/SHA256SUMS"
          ls -lh "${OUTPUT_DIR}"
          mv  ${{ runner.temp }}/nixos-output/nixos-aarch64-rootfs.*.img.xz  ${{ runner.temp }}/nixos-output/NixOS-aarch64-rootfs.*.img.xz

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rootfs
          name: rootfs
          files: |
            ${{ runner.temp }}/NixOS-output/nixos-aarch64-rootfs.*.img.xz
