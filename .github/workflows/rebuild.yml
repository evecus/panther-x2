name: rebuild

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      rootfs:
        description: "发行版/版本 (未填 rootfs 直链时, 从本仓库 release 查找; latest=该发行版最新)"
        required: true
        default: "debian/bookworm"
        type: choice
        options:
          - debian/bookworm
          - debian/trixie
          - debian/forky
          - debian/latest
          - ubuntu/noble
          - ubuntu/jammy
          - ubuntu/resolute
          - ubuntu/latest
          - alpine/latest
          - alpine/edge
          - fedora/44
          - fedora/43
          - fedora/latest
          - archlinux/aarch64
          - opensuse/tumbleweed
          - opensuse/leap156
          - void/latest
          - openwrt/latest
          - openwrt/25.12.5
          - openwrt/25.12.0
          - nixos/latest
      kernel_version:
        description: "内核版本, 如 7.3.8 或 7.3.8-alice (留空=release 中最新)"
        required: false
        default: ""
      kernel_deb_url:
        description: "linux-image-*.deb 直链 (可选, 填了就用链接, 不再去 release 找)"
        required: false
        default: ""
      rootfs_url:
        description: "rootfs 底座镜像直链 (可选, 填了就用链接, 不再去 release 找)"
        required: false
        default: ""
      root_mb:
        description: "rootfs 分区大小 MiB (不含 boot 512M)"
        required: false
        default: "1024"
      root_password:
        description: "镜像 root 初始密码"
        required: false
        default: "1234"
      ssh_pubkey:
        description: "SSH 公钥 (可选, 写入 root 的 authorized_keys)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble image
        env:
          KERNEL_DEB_URL: ${{ inputs.kernel_deb_url }}
          ROOTFS_URL: ${{ inputs.rootfs_url }}
          DISTRO: ${{ inputs.rootfs }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          ROOT_MB: ${{ inputs.root_mb }}
          ROOT_PASS: ${{ inputs.root_password }}
          SSH_PUBKEY: ${{ inputs.ssh_pubkey }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # runner 上 sudo -E 会被忽略, 必须显式传递变量
          sudo \
            KERNEL_DEB_URL="${KERNEL_DEB_URL}" \
            ROOTFS_URL="${ROOTFS_URL}" \
            DISTRO="${DISTRO}" \
            KERNEL_VERSION="${KERNEL_VERSION}" \
            ROOT_MB="${ROOT_MB}" \
            ROOT_PASS="${ROOT_PASS}" \
            SSH_PUBKEY="${SSH_PUBKEY}" \
            REPO="${REPO}" \
            GH_TOKEN="${GH_TOKEN}" \
            OUT="${GITHUB_WORKSPACE}/out" \
            bash rebuild

      - name: Prepare release files
        run: |
          # 脚本以 sudo 运行, 产物属 root, 这里用 sudo 归位并交还给 runner 用户
          sudo mkdir -p release
          sudo mv out/*.img.xz release/
          sudo cp out/build-info.txt release/ 2>/dev/null || true
          sudo chown -R $(id -u):$(id -g) release
          echo "IMG=$(ls release/*.img.xz)" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.img.xz
          tag_name: firmware
