name: RootFS fedora

on:
  workflow_dispatch:
    inputs:

      fedora_release:
        description: "Fedora 版本"
        required: false
        default: "43"
        type: choice
        options:
          - "44"
          - "43"

      root_password:
        description: "root 密码（仅自建 rootfs 时生效）"
        required: false
        default: "1234"

      hostname:
        description: "主机名（仅自建 rootfs 时生效）"
        required: false
        default: "fedora"

      timezone:
        description: "时区（仅自建 rootfs 时生效）"
        required: false
        default: "Asia/Shanghai"
        type: choice
        options:
          - Asia/Shanghai
          - UTC

env:
  TZ: UTC
  FEDORA_MIRROR: "https://dl.fedoraproject.org/pub/fedora/linux"
  ROOTFS_DIR: /opt/fedora-rootfs

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. 初始化环境 ──────────────────────────────────────────────────
      - name: Initialize environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install \
            dnf rpm \
            parted e2fsprogs openssl pigz
          # 写入运行时变量
          echo "FEDORA_RELEASE=${{ inputs.fedora_release || '43' }}" >> "${GITHUB_ENV}"
          echo "ROOT_PASSWORD=${{ inputs.root_password   || '1234' }}"     >> "${GITHUB_ENV}"
          echo "HOSTNAME_VAL=${{ inputs.hostname         || 'fedora' }}"   >> "${GITHUB_ENV}"
          echo "TZ_VAL=${{ inputs.timezone               || 'Asia/Shanghai' }}" >> "${GITHUB_ENV}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      # ── 3A. 构建 rootfs ──────────────────────────────────────────────
      - name: Build Fedora rootfs
        id: build_rootfs
        run: |
          set -euo pipefail
          echo "▶ dnf --installroot (Fedora ${FEDORA_RELEASE}) ..."
          sudo mkdir -p "${ROOTFS_DIR}"
          # host 与 target 同为 aarch64，无需 --forcearch/QEMU 交叉架构引导。
          # 注意：DNF5 的 `install` 子命令不接受 --use-host-config（会报 unrecognized arguments）。
          # 且 host（Ubuntu runner）本身也没有 fedora/updates 仓库配置可供继承，
          # 因此改为通过 --repofrompath 显式指向 Fedora 官方镜像，并跳过 GPG 校验（installroot 内还没导入 Fedora 签名密钥）。
          sudo dnf -y \
            --releasever="${FEDORA_RELEASE}" \
            --installroot="${ROOTFS_DIR}" \
            --setopt=install_weak_deps=False \
            --setopt=reposdir=/dev/null \
            --repofrompath="fedora,${FEDORA_MIRROR}/releases/${FEDORA_RELEASE}/Everything/aarch64/os/" \
            --repofrompath="updates,${FEDORA_MIRROR}/updates/${FEDORA_RELEASE}/Everything/aarch64/" \
            --repo=fedora --repo=updates \
            --nogpgcheck \
            install \
            fedora-release \
            systemd systemd-udev passwd util-linux \
            openssh-server sudo curl wget curl-minimal ca-certificates \
            glibc-langpack-en tzdata \
            iproute systemd-networkd systemd-resolved \
            net-tools iputils bind-utils \
            iw wpa_supplicant chrony bc \
            bash-completion htop nano firewalld \
            uboot-tools dracut parted bluez \
            btrfs-progs e2fsprogs dosfstools \
            lsof file procps-ng cronie util-linux-user \
            rsync
          # 验证关键包
          sudo rpm --root="${ROOTFS_DIR}" -q openssh-server systemd-networkd rsync || {
            echo 'ERROR: 关键包安装不完整'
            exit 1
          }
          sudo dnf --installroot="${ROOTFS_DIR}" clean all
          # ── 时区 / locale / hostname ──────────────────────────────────
          sudo chroot "${ROOTFS_DIR}" ln -sf "/usr/share/zoneinfo/${TZ_VAL}" /etc/localtime
          sudo chroot "${ROOTFS_DIR}" bash -c "echo 'LANG=en_US.UTF-8' > /etc/locale.conf"
          echo "${HOSTNAME_VAL}" | sudo tee "${ROOTFS_DIR}/etc/hostname" > /dev/null
          printf '127.0.0.1\tlocalhost\n127.0.1.1\t%s\n::1\tlocalhost ip6-localhost ip6-loopback\n' \
            "${HOSTNAME_VAL}" | sudo tee "${ROOTFS_DIR}/etc/hosts" > /dev/null
          # ── SSH ───────────────────────────────────────────────────────
          sudo mkdir -p -m 0755 "${ROOTFS_DIR}/var/empty/sshd"
          echo 'UG9ydCAyMgpQZXJtaXRSb290TG9naW4geWVzClBhc3N3b3JkQXV0aGVudGljYXRpb24geWVzClB1YmtleUF1dGhlbnRpY2F0aW9uIHllcwpVc2VQQU0geWVzClgxMUZvcndhcmRpbmcgbm8KUHJpbnRNb3RkIG5vCkFjY2VwdEVudiBMQU5HIExDXyoKU3Vic3lzdGVtIHNmdHAgL3Vzci9saWIvb3BlbnNzaC9zZnRwLXNlcnZlcgo=' \
            | base64 -d | sudo tee "${ROOTFS_DIR}/etc/ssh/sshd_config" > /dev/null
          # ── root 密码 ─────────────────────────────────────────────────
          ROOT_HASH="$(openssl passwd -6 "${ROOT_PASSWORD}")"
          sudo sed -i "s|^root:[^:]*|root:${ROOT_HASH}|" "${ROOTFS_DIR}/etc/shadow"
          # ── systemd 超时 ──────────────────────────────────────────────
          SYS_CONF="${ROOTFS_DIR}/etc/systemd/system.conf"
          [[ -f "${SYS_CONF}" ]] && {
            sudo sed -i "s|^#*DefaultTimeoutStartSec.*|DefaultTimeoutStartSec=10s|g" "${SYS_CONF}"
            sudo sed -i "s|^#*DefaultTimeoutStopSec.*|DefaultTimeoutStopSec=10s|g"   "${SYS_CONF}"
          } || true
          # ── 网络：systemd-networkd 有线 DHCP + resolved ───────────────
          sudo mkdir -p "${ROOTFS_DIR}/etc/systemd/network"
          printf '[Match]\nName=en* eth*\n\n[Network]\nDHCP=yes\nIPv6AcceptRA=yes\n\n[DHCPv4]\nUseDomains=yes\n' \
            | sudo tee "${ROOTFS_DIR}/etc/systemd/network/20-wired.network" > /dev/null
          sudo ln -sf ../run/systemd/resolve/stub-resolv.conf "${ROOTFS_DIR}/etc/resolv.conf"
          # ── enable 服务 ───────────────────────────────────────────────
          sudo chroot "${ROOTFS_DIR}" systemctl enable sshd
          sudo chroot "${ROOTFS_DIR}" systemctl enable systemd-networkd
          sudo chroot "${ROOTFS_DIR}" systemctl enable systemd-resolved
          sudo chroot "${ROOTFS_DIR}" systemctl enable chronyd
          sudo chroot "${ROOTFS_DIR}" systemctl enable firewalld 2>/dev/null || true
          # ── disable 不需要的服务 ──────────────────────────────────────
          sudo chroot "${ROOTFS_DIR}" systemctl disable systemd-networkd-wait-online.service 2>/dev/null || true
          sudo chroot "${ROOTFS_DIR}" systemctl disable e2scrub_reap.service              2>/dev/null || true
          sudo chroot "${ROOTFS_DIR}" systemctl disable systemd-pstore.service            2>/dev/null || true
          # ── uInitrd（dracut 版）──────────────────────────────────────
          # Fedora 用 dracut 而非 initramfs-tools/mkinitramfs，钩子机制不同：
          # dracut 内置了对 uboot 格式（--uboot）的支持，无需 post-update.d 脚本。
          sudo mkdir -p "${ROOTFS_DIR}/etc/dracut.conf.d"
          echo 'uefi_stub="no"' | sudo tee "${ROOTFS_DIR}/etc/dracut.conf.d/99-no-early-run.conf" > /dev/null
          # ── fstab ─────────────────────────────────────────────────────
          printf 'LABEL=ROOTFS\t/\text4\tdefaults,noatime,nodiratime,commit=600,errors=remount-ro\t0 1\n' \
            | sudo tee    "${ROOTFS_DIR}/etc/fstab" > /dev/null
          printf 'LABEL=BOOT\t/boot\tvfat\tdefaults\t0 2\n' \
            | sudo tee -a "${ROOTFS_DIR}/etc/fstab" > /dev/null
          sudo mkdir -p "${ROOTFS_DIR}/usr/lib/modules"
          echo "▶ rootfs 完成: $(sudo du -sh ${ROOTFS_DIR} | awk '{print $1}')"
          echo "status=success" >> "${GITHUB_OUTPUT}"
      # ── 3B. 打包 rootfs tar.gz（仅自建模式）─────────────────────────
      - name: Package rootfs
        id: package_rootfs
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/output"
          mkdir -p "${OUT_DIR}"
          TARBALL="Fedora_${FEDORA_RELEASE}_rootfs.tar.gz"
          echo "▶ 打包 → ${TARBALL} ..."
          sudo tar -czf "${OUT_DIR}/${TARBALL}" -C "${ROOTFS_DIR}" .
          echo "▶ 大小: $(du -sh ${OUT_DIR}/${TARBALL} | awk '{print $1}')"
          cd "${OUT_DIR}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          BUILT_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "TARBALL=${TARBALL}"       >> "${GITHUB_OUTPUT}"
          echo "OUT_DIR=${OUT_DIR}"       >> "${GITHUB_OUTPUT}"
          echo "BUILT_DATE=${BUILT_DATE}" >> "${GITHUB_OUTPUT}"
          echo "status=success"           >> "${GITHUB_OUTPUT}"

      # ── 3C. 将 rootfs 打包成 rebuild 脚本可直接识别的 "*.img.gz" 镜像 ──
      #        产物文件名使用发行版名称 + 版本信息，不再伪装为 Armbian 镜像 ──
      - name: Package rootfs into an image
        id: wrap_image
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/wrap"
          sudo rm -rf "${WORK}" && mkdir -p "${WORK}"

          # rootfs 实际占用大小（MiB）+ 40% 余量 + 512MiB 兜底，
          # 保证后续 apt/内核替换等操作有足够空间
          used_mb=$(sudo du -sm "${ROOTFS_DIR}" | awk '{print $1}')
          img_mb=$(( used_mb * 14 / 10 + 512 ))

          IMG_NAME="Fedora_${FEDORA_RELEASE}_arm64_rootfs.img"
          IMG_PATH="${WORK}/${IMG_NAME}"

          echo "▶ 创建空白镜像: ${img_mb}MiB"
          truncate -s "${img_mb}M" "${IMG_PATH}"

          # 单分区即可：extract_armbian() 里若无 p2 会自动回退用 p1
          parted -s "${IMG_PATH}" mklabel msdos
          parted -s "${IMG_PATH}" mkpart primary ext4 1MiB 100%

          LOOPDEV=$(sudo losetup -P -f --show "${IMG_PATH}")
          sudo mkfs.ext4 -F -L ROOTFS "${LOOPDEV}p1"

          MNT="${WORK}/mnt"
          mkdir -p "${MNT}"
          sudo mount "${LOOPDEV}p1" "${MNT}"

          echo "▶ 写入 rootfs 内容..."
          sudo cp -a "${ROOTFS_DIR}/." "${MNT}/"

          # 确认 os-release 含必需字段（rebuild 脚本的 extract_armbian 会读取 ID / VERSION_CODENAME）
          grep -q '^ID=' "${MNT}/etc/os-release"
          grep -q '^VERSION_CODENAME=' "${MNT}/etc/os-release" || \
            echo "VERSION_CODENAME=${FEDORA_RELEASE}" | sudo tee -a "${MNT}/etc/os-release" > /dev/null

          sync
          sudo umount "${MNT}"
          sudo losetup -d "${LOOPDEV}"

          echo "▶ 压缩镜像 (gzip)..."
          pigz -9 -f "${IMG_PATH}"

          OUT_DIR="${GITHUB_WORKSPACE}/output"
          mkdir -p "${OUT_DIR}"
          mv -f "${IMG_PATH}.gz" "${OUT_DIR}/"
          IMG_GZ_NAME="${IMG_NAME}.gz"

          cd "${OUT_DIR}"
          sha256sum "${IMG_GZ_NAME}" > "${IMG_GZ_NAME}.sha256"

          echo "IMG_GZ_NAME=${IMG_GZ_NAME}"           >> "${GITHUB_OUTPUT}"
          echo "IMG_GZ_PATH=${OUT_DIR}/${IMG_GZ_NAME}" >> "${GITHUB_OUTPUT}"
          echo "OUT_DIR=${OUT_DIR}"                    >> "${GITHUB_OUTPUT}"
          echo "status=success"                        >> "${GITHUB_OUTPUT}"

      - name: Release rootfs
        uses: ncipollo/release-action@main
        with:
          tag: rootfs
          name: "rootfs"
          prerelease: false
          artifacts: |
            ${{ steps.wrap_image.outputs.OUT_DIR }}/${{ steps.wrap_image.outputs.IMG_GZ_NAME }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
